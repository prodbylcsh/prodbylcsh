# Refreshes the "Recently pushed" section of README.md with the latest public repos.
name: Update recent activity

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch recently pushed repos
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          SELF: ${{ github.event.repository.name }}
        run: |
          gh api "users/$OWNER/repos?sort=pushed&per_page=20" --jq '
            .[]
            | select((.fork or .is_template) | not)
            | select(.name != env.SELF)
            | "- [\(.name)](\(.html_url))"
              + (if .description then " – \(.description)" else "" end)
              + " · <sub>\(.pushed_at | fromdateiso8601 | strftime("%d %b %Y"))</sub>"
          ' | head -n 4 > recent.md

      - name: Replace section in README
        run: |
          awk '
            BEGIN { while ((getline line < "recent.md") > 0) block = block line "\n" }
            /<!-- RECENT:START -->/ { print; printf "%s", block; skip = 1; next }
            /<!-- RECENT:END -->/   { skip = 0 }
            !skip
          ' README.md > README.tmp && mv README.tmp README.md
          rm recent.md

      - name: Commit if changed
        run: |
          git diff --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Update recent activity"
          git push
